[runtime]
sampler = test
#sampler = grid
verbosity = standard

[test]
save_dir=output/LSST/3fast_pt/fiducial

[grid]
nsample_dimension=40
#[output]
#save_dir = output/Case
#filename = output/Case/grid_.txt
#format = text
#lock = F
[pipeline]
timing=T
debug=T
modules = consistency camb sigma8_rescale fast_pt load_nz photoz_bias_source photoz_bias_lens IA  pk_to_cl shear_calibration add_intrinsic 2pt_like 
values = examples/Case_2/lssty10_32pt_simulate_values.ini

[sigma8_rescale]
file = ./utility/sample_sigma8/sigma8_rescale.py

